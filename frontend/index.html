<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocFlow-智能文档填表系统</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; }
    .header { background: #1677ff; color: #fff; padding: 16px 32px; display: flex; align-items: center; gap: 12px; }
    .header h1 { font-size: 20px; font-weight: 600; }
    .header span { font-size: 13px; opacity: 0.8; }
    .container { max-width: 960px; margin: 32px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 20px; }
    .card { background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .step-badge { background: #1677ff; color: #fff; border-radius: 50%; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
    .drop-zone { border: 2px dashed #d9d9d9; border-radius: 6px; padding: 32px; text-align: center; cursor: pointer; transition: border-color 0.2s; background: #fafafa; }
    .drop-zone:hover { border-color: #1677ff; background: #e6f4ff; }
    input[type=file] { display: none; }
    .btn { padding: 8px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; font-weight: 500; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #1677ff; color: #fff; }
    .btn-danger { background: #ff4d4f; color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .file-list { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
    .file-item { display: flex; align-items: center; padding: 8px 12px; background: #f6f8fa; border-radius: 4px; font-size: 13px; gap: 8px; }
    .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-size { color: #888; flex-shrink: 0; }
    .tag { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; flex-shrink: 0; }
    .tag-ok  { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
    .tag-err { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; }
    .tag-wait{ background: #e6f4ff; color: #1677ff; border: 1px solid #91caff; }
    textarea { width: 100%; border: 1px solid #d9d9d9; border-radius: 6px; padding: 10px 12px; font-size: 14px; resize: vertical; min-height: 72px; font-family: inherit; }
    textarea:focus { outline: none; border-color: #1677ff; }
    .result-box { background: #f6f8fa; border-radius: 6px; padding: 16px; font-size: 13px; margin-top: 12px; }
    .rrow { display: flex; gap: 8px; margin-bottom: 6px; }
    .rlabel { color: #888; width: 90px; flex-shrink: 0; }
    .rval { font-weight: 500; }
    .ok  { color: #52c41a; }
    .err { color: #ff4d4f; }
    .dl-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 8px 20px; background: #52c41a; color: #fff; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: 500; }
    .dl-btn:hover { opacity: 0.85; }
    .loading { display: flex; align-items: center; gap: 10px; color: #1677ff; font-size: 14px; margin-top: 12px; }
    .spin { width: 18px; height: 18px; border: 2px solid #e6f4ff; border-top-color: #1677ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .msg { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-top: 8px; }
    .msg-info { background: #e6f4ff; color: #1677ff; border: 1px solid #91caff; }
    .msg-err  { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; }
    .cnt { background: #1677ff; color: #fff; border-radius: 10px; padding: 2px 10px; font-size: 12px; margin-left: 8px; }
  </style>
</head>
<body>

<div class="header">
  <h1>🤖 DocFlow-智能文档填表系统</h1>
  <span>支持 docx / xlsx / md / txt</span>
</div>

<div class="container">

  <div class="card">
    <h2>
      <span class="step-badge">1</span>
      上传数据源文档
      <span class="cnt" id="srcCnt">0 个</span>
    </h2>
    <div class="drop-zone" id="srcZone" onclick="document.getElementById('srcInput').click()">
      <div style="font-size:36px">📂</div>
      <p style="margin-top:8px;color:#888">点击或拖拽上传数据源文档（可多选）</p>
      <p style="color:#aaa;font-size:12px;margin-top:4px">支持 .docx .xlsx .md .txt</p>
    </div>
    <input type="file" id="srcInput" multiple accept=".docx,.xlsx,.md,.txt" />
    <div id="srcList" class="file-list"></div>
    <div class="actions">
      <button class="btn btn-primary" id="uploadBtn" disabled onclick="uploadSources()">上传并提取文本</button>
      <button class="btn btn-danger" onclick="clearSources()">清空数据源</button>
    </div>
    <div id="srcMsg"></div>
  </div>

  <div class="card">
    <h2><span class="step-badge">2</span> 上传模板并自动填表</h2>
    <div class="drop-zone" id="tplZone" onclick="document.getElementById('tplInput').click()">
      <div style="font-size:36px">📋</div>
      <p style="margin-top:8px;color:#888">点击或拖拽上传模板文件</p>
      <p style="color:#aaa;font-size:12px;margin-top:4px">支持 .docx .xlsx</p>
    </div>
    <input type="file" id="tplInput" accept=".docx,.xlsx" />
    <div id="tplInfo" class="file-list"></div>
    <div style="margin-top:14px">
      <label style="font-size:13px;color:#555;display:block;margin-bottom:6px">用户要求（可选，留空则自动填表）</label>
      <textarea id="reqInput" placeholder="例如：将日期从2020/7/1到2020/8/31的数据填入模板中"></textarea>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="fillBtn" disabled onclick="fillTemplate()">🚀 开始填表</button>
    </div>
    <div id="fillLoading" style="display:none" class="loading">
      <div class="spin"></div>系统正在分析数据并填写表格，请稍候...
    </div>
    <div id="fillResult"></div>
  </div>

</div>

<script src="/static/app.js"></script>
</body>
</html>
